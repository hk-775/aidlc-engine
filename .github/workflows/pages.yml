name: Publish static project site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate static source
        run: PYTHONPATH=src python3 tools/repo_scan.py external_assets
      - name: Prepare site artifact
        run: |
          mkdir -p .tmp/pages
          cp -R site/. .tmp/pages/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
