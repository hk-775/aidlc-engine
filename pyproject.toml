[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-engine"
version = "0.1.0"
description = "The human-governed automation engine for the AI Development Lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "AI-DLC Engine Contributors"},
]
maintainers = [
  {name = "AI-DLC Engine Maintainers"},
]
keywords = [
  "ai-development-lifecycle",
  "ai-governance",
  "audit",
  "automation",
  "software-delivery",
  "workflow",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aidlc-engine = "aidlc_engine.cli:main"

[project.urls]
Homepage = "https://hk-775.github.io/aidlc-engine/"
Repository = "https://github.com/hk-775/aidlc-engine"
Issues = "https://github.com/hk-775/aidlc-engine/issues"
Documentation = "https://github.com/hk-775/aidlc-engine/tree/main/docs"
Changelog = "https://github.com/hk-775/aidlc-engine/blob/main/CHANGELOG.md"
Security = "https://github.com/hk-775/aidlc-engine/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
