[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-control-plane"
version = "0.1.0"
description = "A human-governed control plane for agent-assisted software delivery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "AIDLC Contributors"},
]
maintainers = [
  {name = "AIDLC Maintainers"},
]
keywords = [
  "ai-governance",
  "audit",
  "software-delivery",
  "workflow",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aidlc = "aidlc.cli:main"

[project.urls]
Homepage = "https://hk-775.github.io/aidlc/"
Repository = "https://github.com/hk-775/aidlc"
Issues = "https://github.com/hk-775/aidlc/issues"
Documentation = "https://github.com/hk-775/aidlc/tree/main/docs"
Changelog = "https://github.com/hk-775/aidlc/blob/main/CHANGELOG.md"
Security = "https://github.com/hk-775/aidlc/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
