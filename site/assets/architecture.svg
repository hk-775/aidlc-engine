<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI-DLC Engine local automation architecture</title>
  <desc id="desc">
    Human and agent callers use a command line and service layer. Policy
    validation bounds the lifecycle core, which writes atomic JSON state and
    append-only audit events. External delivery systems are not connected.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#526176"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #006d5b; stroke-width: 3; }
      .muted { fill: #f6f8f7; stroke: #526176; stroke-width: 3; stroke-dasharray: 10 8; }
      .label { fill: #14213d; font: 700 22px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #526176; font: 18px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #526176; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#fffdf8"/>

  <rect class="box" x="45" y="180" width="190" height="110" rx="18"/>
  <text class="label" x="140" y="225">Human + agent</text>
  <text class="small" x="140" y="255">callers</text>

  <rect class="box" x="300" y="180" width="205" height="110" rx="18"/>
  <text class="label" x="402" y="225">CLI + service</text>
  <text class="small" x="402" y="255">JSON results</text>

  <rect class="box" x="570" y="70" width="220" height="110" rx="18"/>
  <text class="label" x="680" y="115">Policy</text>
  <text class="small" x="680" y="145">fail-closed validation</text>

  <rect class="box" x="570" y="290" width="220" height="110" rx="18"/>
  <text class="label" x="680" y="335">Lifecycle core</text>
  <text class="small" x="680" y="365">deterministic stages</text>

  <rect class="box" x="865" y="70" width="280" height="110" rx="18"/>
  <text class="label" x="1005" y="115">Atomic JSON state</text>
  <text class="small" x="1005" y="145">recoverable transaction</text>

  <rect class="box" x="865" y="225" width="280" height="110" rx="18"/>
  <text class="label" x="1005" y="270">Audit event files</text>
  <text class="small" x="1005" y="300">exclusive append + hashes</text>

  <rect class="muted" x="865" y="380" width="280" height="90" rx="18"/>
  <text class="label" x="1005" y="418">Delivery systems</text>
  <text class="small" x="1005" y="448">not connected</text>

  <path class="line" d="M235 235H300"/>
  <path class="line" d="M505 220 570 145"/>
  <path class="line" d="M680 180V290"/>
  <path class="line" d="M790 320 865 160"/>
  <path class="line" d="M790 345 865 280"/>
  <path class="line" stroke-dasharray="10 8" d="M790 365 865 425"/>
</svg>
